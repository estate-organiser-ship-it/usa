<script>
  // The QR on the back of the printed book lands here. Tag the visit so a sale
  // from a book someone passed on is tellable apart from an ad or the newsletter,
  // then hand straight over to the sales page. ?s= says which surface was scanned
  // (bc = back cover), so placements stay separable later.
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      var u = new URL("https://theestateorganiser.com/the-estate-organizer/");
      u.searchParams.set("utm_source", "book");
      u.searchParams.set("utm_medium", "print");
      u.searchParams.set("utm_campaign", "book-qr");
      u.searchParams.set("utm_content", p.get("s") || "bc");
      location.replace(u.toString());
    } catch (e) {
      location.replace("https://theestateorganiser.com/the-estate-organizer/");
    }
  })();
</script>
